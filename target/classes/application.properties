spring.application.name=cabshare
server.port=8080

# ---- MySQL (the database is created automatically if it does not exist) ----
# Change the password below, or set the DB_USERNAME / DB_PASSWORD environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/cabshare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

# Hibernate creates/updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# ---- CabShare business settings ----
cabshare.route.fare=1300
cabshare.max.group.passengers=4
cabshare.max.group.luggage=4
cabshare.offer.expiry.minutes=10
